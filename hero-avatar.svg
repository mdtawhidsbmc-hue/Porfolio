<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background decorative ring -->
  <circle cx="250" cy="250" r="210" fill="url(#bgGrad)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="250" cy="250" r="185" fill="#0B0F19" stroke="url(#neonViolet)" stroke-width="3" filter="url(#glow)" opacity="0.8"/>

  <!-- Creative geometric backdrop elements -->
  <rect x="70" y="80" width="40" height="40" rx="10" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6" transform="rotate(15 90 100)"/>
  <circle cx="410" cy="110" r="18" fill="none" stroke="#FBBF24" stroke-width="2" opacity="0.6"/>
  <polygon points="400,380 430,420 370,420" fill="none" stroke="#A855F7" stroke-width="2" opacity="0.5"/>
  <circle cx="90" cy="390" r="8" fill="#06B6D4" opacity="0.7"/>

  <!-- Character / Avatar Silhouette & Styling -->
  <!-- Shoulders & Coat -->
  <path d="M 120 440 C 120 360, 160 330, 210 320 L 290 320 C 340 330, 380 360, 380 440 Z" fill="#1E293B"/>
  <path d="M 210 320 L 250 380 L 290 320 Z" fill="#0F172A"/>
  <!-- Inner shirt / Neon collar accent -->
  <path d="M 225 320 L 250 360 L 275 320 Z" fill="url(#neonViolet)"/>
  
  <!-- Neck -->
  <rect x="230" y="270" width="40" height="55" rx="10" fill="#E2E8F0"/>
  <!-- Head & Face -->
  <ellipse cx="250" cy="220" rx="65" ry="75" fill="#F8FAFC"/>
  <!-- Hair - Modern Creative Crop -->
  <path d="M 175 210 C 175 140, 220 130, 270 135 C 310 140, 330 170, 325 210 C 310 175, 290 165, 250 165 C 205 165, 185 185, 175 210 Z" fill="#0F172A"/>
  <path d="M 180 180 C 195 150, 240 140, 290 145 C 315 150, 310 175, 295 170 C 265 160, 220 165, 180 180 Z" fill="url(#neonCyan)"/>
  
  <!-- Stylish Designer Glasses -->
  <rect x="205" y="205" width="38" height="26" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
  <rect x="257" y="205" width="38" height="26" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
  <line x1="243" y1="218" x2="257" y2="218" stroke="#38BDF8" stroke-width="2.5"/>
  <line x1="185" y1="215" x2="205" y2="215" stroke="#38BDF8" stroke-width="2"/>
  <line x1="295" y1="215" x2="315" y2="215" stroke="#38BDF8" stroke-width="2"/>

  <!-- Confident Smile & Facial Accents -->
  <path d="M 235 255 Q 250 268 265 255" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Creative Tool Badges -->
  <!-- Badge 1: Graphic Design (Pen Tool / Ps) -->
  <g transform="translate(60, 210)">
    <rect width="64" height="64" rx="16" fill="#0F172A" stroke="#8B5CF6" stroke-width="2" filter="url(#glow)"/>
    <text x="32" y="38" fill="#C084FC" font-family="sans-serif" font-weight="900" font-size="20" text-anchor="middle">Ps</text>
    <text x="32" y="52" fill="#94A3B8" font-family="sans-serif" font-weight="700" font-size="8" text-anchor="middle">DESIGN</text>
  </g>

  <!-- Badge 2: Video Editing (Play / Pr) -->
  <g transform="translate(376, 210)">
    <rect width="64" height="64" rx="16" fill="#0F172A" stroke="#06B6D4" stroke-width="2" filter="url(#glow)"/>
    <text x="32" y="38" fill="#38BDF8" font-family="sans-serif" font-weight="900" font-size="20" text-anchor="middle">Pr</text>
    <text x="32" y="52" fill="#94A3B8" font-family="sans-serif" font-weight="700" font-size="8" text-anchor="middle">VIDEO</text>
  </g>

  <!-- Badge 3: Digital Marketing (Growth Graph) -->
  <g transform="translate(218, 400)">
    <rect width="64" height="64" rx="16" fill="#0F172A" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
    <path d="M 18 42 L 28 32 L 36 38 L 46 22" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="40,22 46,22 46,28" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <text x="32" y="54" fill="#6EE7B7" font-family="sans-serif" font-weight="700" font-size="8" text-anchor="middle">ROAS</text>
  </g>
</svg>