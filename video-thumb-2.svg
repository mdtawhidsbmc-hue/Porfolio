<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="vt2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="vt2-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="vt2-flare">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#vt2-bg)"/>

  <!-- Tech Geometric Background Lines -->
  <circle cx="300" cy="200" r="160" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1.5" stroke-dasharray="8 8"/>
  <circle cx="300" cy="200" r="110" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1"/>

  <!-- High-Tech Headphone Ear-cup Mockup Vector -->
  <!-- Outer Ring -->
  <ellipse cx="300" cy="200" rx="90" ry="120" fill="#0B132B" stroke="url(#vt2-glow)" stroke-width="4" filter="url(#vt2-flare)"/>
  <!-- Inner Cushion -->
  <ellipse cx="300" cy="200" rx="60" ry="85" fill="#1C2541" stroke="#3A506B" stroke-width="2"/>
  <!-- Central Glowing LED Accent Ring -->
  <circle cx="300" cy="200" r="30" fill="#000000" stroke="#00F2FE" stroke-width="3"/>
  
  <!-- Play Button Icon inside center -->
  <polygon points="294,188 312,200 294,212" fill="#00F2FE"/>

  <!-- Tech Spec Callouts & Lines -->
  <g stroke="#06B6D4" stroke-width="1.5">
    <line x1="220" y1="120" x2="140" y2="90"/>
    <circle cx="140" cy="90" r="3" fill="#06B6D4"/>
    <text x="130" y="85" fill="#38BDF8" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="end">ACTIVE NOISE CANCEL 2.0</text>
    <text x="130" y="99" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="end">48dB HYBRID DAMPING</text>

    <line x1="380" y1="280" x2="460" y2="310"/>
    <circle cx="460" cy="310" r="3" fill="#06B6D4"/>
    <text x="470" y="308" fill="#38BDF8" font-family="sans-serif" font-weight="700" font-size="10">BERYLLIUM 40MM DRIVERS</text>
    <text x="470" y="322" fill="#94A3B8" font-family="sans-serif" font-size="9">HIGH-RES WIRELESS AUDIO</text>
  </g>

  <!-- Top Bar -->
  <rect x="25" y="25" width="165" height="26" rx="4" fill="rgba(6,182,212,0.15)" stroke="#06B6D4" stroke-width="1"/>
  <text x="107" y="42" fill="#38BDF8" font-family="sans-serif" font-weight="800" font-size="10" text-anchor="middle">COMMERCIAL ADVERT</text>

  <rect x="495" y="25" width="80" height="26" rx="4" fill="rgba(0,0,0,0.6)"/>
  <text x="535" y="42" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">00:30 TVC</text>

  <!-- Bottom Title -->
  <text x="300" y="355" fill="#FFFFFF" font-family="'Syne', sans-serif" font-weight="800" font-size="20" text-anchor="middle" letter-spacing="3">PULSE // APEX SOUND</text>
  <text x="300" y="375" fill="#64748B" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Color Graded in DaVinci Resolve • 3D Compositing in Blender &amp; AE</text>
</svg>