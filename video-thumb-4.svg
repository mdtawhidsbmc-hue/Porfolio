<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="vt4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050A"/>
      <stop offset="50%" stop-color="#0F0C20"/>
      <stop offset="100%" stop-color="#05050A"/>
    </linearGradient>
    <linearGradient id="vt4-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="vt4-flare">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#vt4-bg)"/>

  <!-- Particle Explosion & Optical Flares -->
  <g stroke="#818CF8" opacity="0.4">
    <line x1="300" y1="200" x2="120" y2="80" stroke-width="1.5"/>
    <line x1="300" y1="200" x2="480" y2="80" stroke-width="1.5"/>
    <line x1="300" y1="200" x2="100" y2="300" stroke-width="1.5"/>
    <line x1="300" y1="200" x2="520" y2="320" stroke-width="1.5"/>
    <line x1="300" y1="200" x2="300" y2="40" stroke-width="2"/>
    <line x1="300" y1="200" x2="300" y2="360" stroke-width="2"/>
  </g>

  <!-- Glowing Particles -->
  <circle cx="210" cy="140" r="3" fill="#A5B4FC"/>
  <circle cx="390" cy="130" r="4" fill="#C084FC"/>
  <circle cx="170" cy="270" r="3.5" fill="#67E8F9"/>
  <circle cx="430" cy="260" r="2.5" fill="#F472B6"/>
  <circle cx="270" cy="80" r="2" fill="#FFFFFF"/>
  <circle cx="340" cy="320" r="3" fill="#A5B4FC"/>

  <!-- 3D Metallic Hexagonal Emblem in Motion -->
  <polygon points="300,100 380,150 380,250 300,300 220,250 220,150" fill="none" stroke="url(#vt4-metal)" stroke-width="8" filter="url(#vt4-flare)"/>
  <polygon points="300,130 355,165 355,235 300,270 245,235 245,165" fill="#0A0817" stroke="#A5B4FC" stroke-width="3"/>
  
  <!-- Central Flare / Spark Core -->
  <circle cx="300" cy="200" r="24" fill="#FFFFFF" filter="url(#vt4-flare)"/>
  <polygon points="293,190 314,200 293,210" fill="#4338CA"/>

  <!-- Title & Specs -->
  <text x="300" y="345" fill="#FFFFFF" font-family="'Syne', sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="4">3D KINETIC LOGO STING</text>
  <text x="300" y="370" fill="#A5B4FC" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Cinema 4D + Redshift Render • Custom Audio Design</text>

  <rect x="25" y="25" width="130" height="24" rx="4" fill="rgba(129, 140, 248, 0.2)" stroke="#818CF8" stroke-width="1"/>
  <text x="90" y="41" fill="#C7D2FE" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">BRAND INTRO / VFX</text>
</svg>