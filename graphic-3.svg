<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="g3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <linearGradient id="g3-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="g3-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#g3-bg)"/>

  <!-- Caution Tape Banner across top -->
  <g transform="rotate(-4 300 80)">
    <rect x="-50" y="40" width="700" height="38" fill="#FACC15"/>
    <text x="50" y="65" fill="#000000" font-family="'Arial Black', sans-serif" font-weight="900" font-size="14" letter-spacing="3">/// BLACK FRIDAY DROP /// 50% OFF EVERYTHING /// LIMITED RUN /// 50% OFF ///</text>
  </g>

  <!-- Big Bold Typography -->
  <text x="60" y="160" fill="#FFFFFF" font-family="'Syne', 'Impact', sans-serif" font-weight="900" font-size="64" letter-spacing="-1">VORTEX</text>
  <text x="350" y="160" fill="#71717A" font-family="'Syne', 'Impact', sans-serif" font-weight="900" font-size="64" letter-spacing="-1">LABS</text>

  <text x="60" y="195" fill="#EF4444" font-family="sans-serif" font-weight="800" font-size="16" letter-spacing="4">FALL/WINTER HIGH-PERFORMANCE TECHWEAR</text>

  <!-- Product Showcase Box -->
  <rect x="60" y="225" width="480" height="340" rx="16" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
  
  <!-- Subtle Grid inside product box -->
  <line x1="60" y1="395" x2="540" y2="395" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="300" y1="225" x2="300" y2="565" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Modern Graphic Apparel Illustration / Hoodie Vector -->
  <path d="M 230 290 Q 300 320 370 290 L 410 360 L 375 375 L 365 500 L 235 500 L 225 375 L 190 360 Z" fill="#27272A" stroke="#52525B" stroke-width="2"/>
  <path d="M 270 295 Q 300 340 330 295" fill="none" stroke="#EF4444" stroke-width="3"/>
  <rect x="275" y="370" width="50" height="50" fill="#09090B" rx="6" stroke="#EF4444" stroke-width="1"/>
  <text x="300" y="398" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">VX-01</text>
  
  <!-- Floating Discount Badge -->
  <g transform="translate(420, 245)">
    <circle cx="45" cy="45" r="45" fill="url(#g3-red)"/>
    <text x="45" y="40" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-weight="900" font-size="22" text-anchor="middle">-50%</text>
    <text x="45" y="58" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="10" text-anchor="middle">OFF</text>
  </g>

  <!-- Tag / Feature Pills -->
  <rect x="80" y="245" width="110" height="26" rx="13" fill="#27272A"/>
  <text x="135" y="262" fill="#E4E4E7" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">WATERPROOF</text>

  <rect x="80" y="280" width="100" height="26" rx="13" fill="#27272A"/>
  <text x="130" y="297" fill="#E4E4E7" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">AEROSPACE</text>

  <!-- Price & Conversion CTA -->
  <text x="60" y="610" fill="#A1A1AA" font-family="sans-serif" font-size="14" text-decoration="line-through">$189.00 USD</text>
  <text x="180" y="612" fill="#FFFFFF" font-family="'Syne', sans-serif" font-weight="900" font-size="32">$94.50</text>
  
  <!-- High Converting Button -->
  <rect x="340" y="580" width="200" height="52" rx="10" fill="#FFFFFF"/>
  <text x="440" y="612" fill="#09090B" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">CLAIM CODE: BF50 →</text>

  <!-- Social Ad Meta Footer -->
  <line x1="60" y1="660" x2="540" y2="660" stroke="#27272A" stroke-width="1"/>
  <text x="60" y="695" fill="#71717A" font-family="sans-serif" font-weight="600" font-size="11">DELIVERABLE: 1:1 SQUARE &amp; 9:16 STORIES AD SUITE</text>
  <text x="540" y="695" fill="#22C55E" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="end">CTR ACHIEVED: 4.2%</text>
</svg>