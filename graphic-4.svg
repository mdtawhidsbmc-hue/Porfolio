<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="g4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="g4-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#g4-bg)"/>

  <!-- Construction Grid Lines -->
  <g stroke="rgba(56, 189, 248, 0.12)" stroke-width="1">
    <circle cx="300" cy="240" r="120" fill="none"/>
    <circle cx="300" cy="240" r="80" fill="none"/>
    <circle cx="300" cy="240" r="40" fill="none"/>
    <line x1="180" y1="240" x2="420" y2="240"/>
    <line x1="300" y1="120" x2="300" y2="360"/>
    <line x1="215" y1="155" x2="385" y2="325"/>
    <line x1="215" y1="325" x2="385" y2="155"/>
  </g>

  <!-- Precision Logo Geometry Mark -->
  <path d="M 260 170 L 340 170 L 370 240 L 340 310 L 260 310 L 230 240 Z" fill="none" stroke="url(#g4-blue)" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="300" cy="240" r="24" fill="#38BDF8"/>

  <!-- Brand Typography and Guidelines -->
  <text x="300" y="400" fill="#FFFFFF" font-family="'Syne', sans-serif" font-weight="800" font-size="36" text-anchor="middle" letter-spacing="4">NEXUS AI</text>
  <text x="300" y="425" fill="#94A3B8" font-family="sans-serif" font-weight="600" font-size="12" text-anchor="middle" letter-spacing="3">GLOBAL BRAND IDENTITY SYSTEM v2.0</text>

  <!-- Color Palette Swatches -->
  <g transform="translate(100, 470)">
    <!-- Swatch 1 -->
    <rect x="0" y="0" width="80" height="60" rx="8" fill="#0B0F19" stroke="#334155" stroke-width="1"/>
    <text x="40" y="80" fill="#E2E8F0" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">Obsidian</text>
    <text x="40" y="94" fill="#64748B" font-family="sans-serif" font-size="8" text-anchor="middle">#0B0F19</text>

    <!-- Swatch 2 -->
    <rect x="105" y="0" width="80" height="60" rx="8" fill="#38BDF8"/>
    <text x="145" y="80" fill="#E2E8F0" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">Cyan Glow</text>
    <text x="145" y="94" fill="#64748B" font-family="sans-serif" font-size="8" text-anchor="middle">#38BDF8</text>

    <!-- Swatch 3 -->
    <rect x="210" y="0" width="80" height="60" rx="8" fill="#6366F1"/>
    <text x="250" y="80" fill="#E2E8F0" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">Indigo Core</text>
    <text x="250" y="94" fill="#64748B" font-family="sans-serif" font-size="8" text-anchor="middle">#6366F1</text>

    <!-- Swatch 4 -->
    <rect x="315" y="0" width="80" height="60" rx="8" fill="#F8FAFC"/>
    <text x="355" y="80" fill="#E2E8F0" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">Pure Light</text>
    <text x="355" y="94" fill="#64748B" font-family="sans-serif" font-size="8" text-anchor="middle">#F8FAFC</text>
  </g>

  <!-- Typography Hierarchy Spec -->
  <g transform="translate(60, 600)">
    <rect width="480" height="90" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#38BDF8" font-family="sans-serif" font-weight="800" font-size="12">TYPOGRAPHY GUIDELINES</text>
    <text x="20" y="58" fill="#FFFFFF" font-family="'Syne', sans-serif" font-weight="800" font-size="16">Display: Syne Bold (Headings &amp; Hero)</text>
    <text x="20" y="78" fill="#94A3B8" font-family="sans-serif" font-weight="400" font-size="12">Body &amp; Data: Plus Jakarta Sans / Inter 400 &amp; 600</text>
    <rect x="360" y="24" width="100" height="30" rx="6" fill="#38BDF8"/>
    <text x="410" y="44" fill="#0F172A" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">PDF ASSETS</text>
  </g>
</svg>